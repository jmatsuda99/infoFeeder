<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>infoFeeder Web</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="/static/half_hour_auto_fetch.js"></script>
    <script>
        function setCopyButtonFeedback(button, success) {
            const originalLabel = button.dataset.originalLabel || button.textContent;
            const resetMs = Number(button.dataset.resetMs || "1200");
            button.dataset.originalLabel = originalLabel;
            button.textContent = success ? "Copied" : "Failed";
            window.setTimeout(() => {
                button.textContent = originalLabel;
            }, resetMs);
        }

        async function copyArticlePayload(button) {
            const payload = button.dataset.copyText || "";
            try {
                await navigator.clipboard.writeText(payload);
                setCopyButtonFeedback(button, true);
            } catch (error) {
                setCopyButtonFeedback(button, false);
            }
        }

        function escapeHtml(value) {
            return value
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function formatInlineOverviewHtml(text) {
            let html = escapeHtml(text);
            html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            html = html.replace(
                /(https?:\/\/[^\s<]+)/g,
                '<a href="$1" target="_blank" rel="noreferrer">$1</a>'
            );
            return html;
        }

        function buildOverviewHtml(text) {
            const lines = text.split(/\r?\n/);
            const blocks = [];
            let listItems = [];

            function flushList() {
                if (!listItems.length) {
                    return;
                }
                blocks.push("<ul>" + listItems.map((item) => "<li>" + item + "</li>").join("") + "</ul>");
                listItems = [];
            }

            for (const rawLine of lines) {
                const line = rawLine.trim();
                if (!line) {
                    flushList();
                    continue;
                }
                if (line.startsWith("- ")) {
                    listItems.push(formatInlineOverviewHtml(line.slice(2)));
                    continue;
                }
                flushList();
                blocks.push("<p>" + formatInlineOverviewHtml(line) + "</p>");
            }

            flushList();
            return blocks.join("");
        }

        async function copyOverviewRichText(button) {
            const payload = button.dataset.copyText || "";
            const html = buildOverviewHtml(payload);

            try {
                if (navigator.clipboard.write && window.ClipboardItem) {
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            "text/plain": new Blob([payload], { type: "text/plain" }),
                            "text/html": new Blob([html], { type: "text/html" }),
                        }),
                    ]);
                } else {
                    await navigator.clipboard.writeText(payload);
                }
                setCopyButtonFeedback(button, true);
            } catch (error) {
                setCopyButtonFeedback(button, false);
            }
        }

        infoFeederScheduleHalfHourAutoFetch(function () {
            const form = document.querySelector("form.filters");
            if (form && window.htmx) {
                const query = new URLSearchParams(new FormData(form)).toString();
                window.htmx.ajax("GET", "/articles/list?" + query, {
                    target: "#article-list",
                    swap: "innerHTML",
                });
                window.htmx.ajax("GET", "/articles/metrics", {
                    target: "#metrics-strip",
                    swap: "outerHTML",
                });
            }
        });
    </script>
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="hero-row">
                <div>
                    <h1>infoFeeder Web</h1>
                    <p>Version {{ app_version }}</p>
                </div>
                <nav class="top-nav">
                    <a class="nav-link is-active" href="/">Articles</a>
                    <a class="nav-link" href="/sources">Sources</a>
                </nav>
            </div>
        </section>

        {% include "partials/metrics_strip.html" %}

        <section class="panel">
            <form method="post" action="/articles/fetch" class="fetch-actions">
                <input type="hidden" name="keyword" value="{{ keyword }}">
                <input type="hidden" name="read_filter" value="{{ read_filter }}">
                <input type="hidden" name="saved_filter" value="{{ saved_filter }}">
                <input type="hidden" name="sort_order" value="{{ sort_order }}">
                <input type="hidden" name="limit" value="{{ limit }}">
                <button type="submit">Fetch articles now</button>
            </form>
            {% if fetch_message %}
            <p class="success-text">{{ fetch_message }}</p>
            {% endif %}
            {% if fetch_error %}
            <p class="error-text">{{ fetch_error }}</p>
            {% endif %}

            <form
                id="article-filters"
                class="filters"
                hx-get="/articles/list"
                hx-target="#article-list"
                hx-swap="innerHTML"
                onsubmit="history.replaceState(null, '', '/?' + new URLSearchParams(new FormData(this)).toString())"
            >
                <input type="text" name="keyword" value="{{ keyword }}" placeholder="Keyword">
                <select name="read_filter">
                    <option value="all" {% if read_filter == "all" %}selected{% endif %}>All</option>
                    <option value="unread" {% if read_filter == "unread" %}selected{% endif %}>Unread</option>
                    <option value="read" {% if read_filter == "read" %}selected{% endif %}>Read</option>
                </select>
                <select name="saved_filter">
                    <option value="all" {% if saved_filter == "all" %}selected{% endif %}>All saved states</option>
                    <option value="saved" {% if saved_filter == "saved" %}selected{% endif %}>Saved only</option>
                </select>
                <select name="sort_order">
                    <option value="newest" {% if sort_order == "newest" %}selected{% endif %}>Newest</option>
                    <option value="oldest" {% if sort_order == "oldest" %}selected{% endif %}>Oldest</option>
                    <option value="saved" {% if sort_order == "saved" %}selected{% endif %}>Saved first</option>
                </select>
                <input type="number" name="limit" min="1" max="100" value="{{ limit }}">
                <button type="submit">Apply filters</button>
            </form>
        </section>

        <section id="article-list">
            {% include "partials/article_list.html" %}
        </section>
    </main>
</body>
</html>
